apiVersion: v1
kind: Service
metadata:
  name: estatehub-frontend
  namespace: estatehub
  labels:
    app: estatehub-frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: estatehub-frontend

  ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}